{% extends "base.html" %} {%block body_class%}edit-developers-page{%endblock%} {% block content %}
<h1 class="edit-dev-title"><i class="fa-solid fa-users-gear"></i>
  <span class="dev-title-span">M</span>anage <span class="dev-title-span">D</span>evelopers
</h1>
<!-- Update Developer Profile -->
<div class="edit-developer-wrapper">
  <h2 class="edit-heading-title"><i class="fa-solid fa-user-pen"></i>Update Developer Profile</h2>
  <section class="form-container panel-layout">
    <form action="{{ url_for('edit_developer', developer_id=developer.id)}}" method="POST" class="edit-developer-form">
      <!-- First Name -->
      <label for="first_name" class="Add-form-label">First Name</label>
      <input type="text" id="first_name" name="first_name" value="{{ developer.first_name }}" required />
      <!-- Last Name -->
      <label for="last_name" class="Add-form-label">Last Name</label>
      <input type="text" id="last_name" name="last_name" value="{{ developer.last_name }}" required />
      <!-- Email -->
      <label for="email" class="Add-form-label">Email</label>
      <input type="email" id="email" name="email" value="{{ developer.email }}" required />
      <!-- Update button -->
      <button type="submit" class="btn-edit-dev-form"><i class="fa-solid fa-pen"></i> Update
        Data</button>
      <!-- Cancel button -->
      <a href="{{ url_for('add_developer') }}" class="btn-edit-dev-cancel"><i class="fa-solid fa-ban"></i> Cancel</a>
    </form>
  </section>
</div>
{% endblock %}
